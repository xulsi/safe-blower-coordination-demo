## config.yaml
## Numeric values taken from the paper where given (Table 1, speed grid, SBO).
## Remaining values are physically consistent stand-ins for unpublished vendor maps.

num_blowers: 3

blower_model:
  rated_capacity: 4600          # Nm3, Table 1
  motor_power: 78               # kW per blower, Table 1
  speed_range: [0.60, 1.00]
  speed_step: 0.05
  map:
    shutoff_pressure: 80.0      # kPa at Q=0, N=1 (synthetic vendor map)
    rated_pressure: 62.0        # kPa at rated flow, N=1; above the 51 kPa setpoint so VFD can trim
  polynomial_fit:
    target_mae: 0.91
    target_max_dev: 1.82
  safety:
    surge_flow_fraction: 0.50   # Q < 0.50 * Q_rated * N is surge
    overheat_flow_fraction: 1.05
    overheat_temperature: 120.0 # deg C

network_model:
  header_pressure_setpoint: 51  # kPa, Table 1
  pressure_tolerance: 5.0       # kPa band around setpoint
  pipe_diameter: 300            # mm, Table 1
  static_pressure: 45.0         # kPa grit-chamber back pressure (not published; calibrated stand-in)
  resistance_coefficient: 2.5e-7
  sensitivity_analysis:
    perturbation: 0.05

optimizer:
  penalty:
    lambda_sw: 0.0              # not specified in the paper; 0 so the objective is electrical power
    lambda_ramp: 0.0
  grid_search:
    speed_grid: [0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
  sbo:
    init_samples: 5
    early_stopping: 0.05
    max_iter: 30
    gp_kernel: "RBF"
    acquisition: "Expected Improvement"

simulation:
  # Demands sized from rated 4600 Nm3 so 1 / 2 / 3 blowers match Table 2 scenario names.
  demand_scenarios:
    - scenario: single_blower_low_demand
      demand: 2500
    - scenario: single_blower_medium_demand
      demand: 3400
    - scenario: dual_blower_low_demand
      demand: 5000
    - scenario: dual_blower_medium_demand
      demand: 6400
    - scenario: dual_blower_high_demand
      demand: 8000
    - scenario: triple_blower_high_demand
      demand: 10800
    - scenario: triple_blower_very_high_demand
      demand: 12600
  evaluation_metrics:
    - energy_savings_percent
    - runtime_seconds
    - evaluation_count
